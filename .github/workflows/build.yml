name: Build Backslashxx KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run build script
        run: bash build.sh
        env:
          KERNEL_COMMIT: "085f3aff23bc67a15507f06310e633205bb924f7"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: Backslashxx-SusFS-kiev
          path: output/*
